<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9-a-side Team Sheet</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f3;color:#18342a;font-family:Arial,sans-serif}.app{max-width:1050px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:24px;margin:0}p{margin:5px 0;color:#60746b}.controls{display:flex;gap:8px;align-items:end;flex-wrap:wrap}label{display:grid;gap:4px;font-size:12px;font-weight:bold}select,input,textarea{font:inherit;border:1px solid #ccd9d2;border-radius:8px;padding:8px;background:white;color:#18342a}button{font:inherit;border:0;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer;background:#16764a;color:white}.alt{background:#dde7e2;color:#18342a}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.main{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px}.pitch{position:relative;min-height:670px;overflow:hidden;border:4px solid white;border-radius:14px;background:repeating-linear-gradient(0deg,#147246 0,#147246 74px,#126b41 74px,#126b41 148px);box-shadow:0 8px 22px #0a2d1e29}.halfway{position:absolute;left:0;right:0;top:50%;border-top:2px solid #ffffffcc}.circle{position:absolute;width:125px;height:125px;border:2px solid #ffffffcc;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.box{position:absolute;width:48%;height:16%;left:26%;border:2px solid #ffffffcc}.box.top{top:-2px}.box.bottom{bottom:-2px}.player{position:absolute;width:18%;max-width:130px;transform:translate(-50%,-50%);text-align:center}.badge{width:38px;height:38px;margin:auto;border-radius:50%;display:grid;place-items:center;background:white;border:3px solid #ffd24a;color:#105c39;font-weight:bold;box-shadow:0 3px 8px #0004}.player input{width:100%;margin-top:4px;border:0;padding:5px 3px;text-align:center;font-size:12px;font-weight:bold;background:#fffffff2}aside{background:white;border:1px solid #d2ded8;border-radius:14px;padding:14px}aside h2{margin:0 0 10px;font-size:18px}.sub{display:grid;grid-template-columns:32px 1fr;gap:7px;align-items:center;margin-bottom:8px}.sub span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#16764a;color:white;font-weight:bold;font-size:12px}.sub input,textarea{width:100%}textarea{min-height:110px;resize:vertical}.status{font-size:12px;color:#60746b;min-height:17px;margin-top:8px}@media(max-width:720px){.main{grid-template-columns:1fr}.details{grid-template-columns:1fr}.pitch{min-height:600px}}@media print{body{background:white}.app{padding:0}.controls,p,.status{display:none!important}.main{grid-template-columns:1fr 190px}}
</style></head><body><div class="app"><div class="head"><div><h1>9-a-side Team Sheet</h1><p>1 goalkeeper + 8 outfield players. Enter names, choose formation and print or save as PDF.</p></div><div class="controls"><label>Formation<select id="formation"><option value="332">3-3-2</option><option value="323">3-2-3</option><option value="242">2-4-2</option><option value="431">4-3-1</option><option value="341">3-4-1</option><option value="233">2-3-3</option></select></label><button class="alt" id="clear" type="button">Clear names</button><button id="print" type="button">Print / PDF</button></div></div><div class="details"><label>Team<input id="team"></label><label>Opposition<input id="opposition"></label><label>Date / Venue<input id="fixture"></label></div><div class="main"><div class="pitch"><div class="halfway"></div><div class="circle"></div><div class="box top"></div><div class="box bottom"></div><div id="players"></div></div><aside><h2>Substitutes</h2><div id="subs"></div><label>Coach's notes<textarea placeholder="Captain, rotation plan, positions..."></textarea></label><div class="status" id="status" aria-live="polite"></div></aside></div></div><script>
(()=>{const formations={332:[3,3,2],323:[3,2,3],242:[2,4,2],431:[4,3,1],341:[3,4,1],233:[2,3,3]},sel=document.getElementById('formation'),holder=document.getElementById('players'),status=document.getElementById('status');function add(n,x,y,v=''){const p=document.createElement('div');p.className='player';p.style.left=x+'%';p.style.top=y+'%';const b=document.createElement('div');b.className='badge';b.textContent=n;const i=document.createElement('input');i.value=v;i.placeholder=n===1?'Goalkeeper':'Player name';i.setAttribute('aria-label','Player '+n);p.append(b,i);holder.append(p)}function render(){const names=[...holder.querySelectorAll('input')].map(x=>x.value);holder.innerHTML='';add(1,50,91,names[0]);let n=2;const ys=[70,44,17];formations[sel.value].forEach((count,row)=>{for(let i=0;i<count;i++){add(n,100/(count+1)*(i+1),ys[row],names[n-1]);n++}});status.textContent='9 starters: goalkeeper plus 8 outfield players.'}for(let n=10;n<=15;n++){const r=document.createElement('div');r.className='sub';const s=document.createElement('span');s.textContent=n;const i=document.createElement('input');i.placeholder='Substitute name';r.append(s,i);document.getElementById('subs').append(r)}sel.addEventListener('change',render);document.getElementById('clear').addEventListener('click',()=>{document.querySelectorAll('.player input,.sub input').forEach(i=>i.value='');status.textContent='Player names cleared.'});document.getElementById('print').addEventListener('click',()=>window.print());render()})();
</script></body></html>
